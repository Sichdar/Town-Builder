<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hearthfield</title>
  <meta name="theme-color" content="#4f8f3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hearthfield">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #4f8f3a;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #stick {
      position: fixed; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px;
      border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.55);
      box-sizing: border-box; pointer-events: none; opacity: 0; transition: opacity 0.12s;
    }
    #stick.on { opacity: 1; }
    #knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
      border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    #hint {
      position: fixed; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom)); transform: translateX(-50%);
      color: #fff; font-size: 18px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.45);
      pointer-events: none; transition: opacity 0.6s; white-space: nowrap;
    }
    #hint.gone { opacity: 0; }

    #hud {
      position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%);
      display: flex; gap: 6px; pointer-events: none; font-weight: 700; font-size: 17px; color: #3a2a14;
    }
    .pill {
      background: rgba(255,248,230,0.92); border-radius: 18px; padding: 6px 10px; font-weight: 700; font-size: 17px; color: #3a2a14;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    #full {
      position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translateX(-50%) scale(0.8);
      background: #d9442b; color: #fff; font-weight: 800; font-size: 15px; padding: 4px 12px; border-radius: 12px;
      opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap;
    }
    #full.on { opacity: 1; transform: translateX(-50%) scale(1); }
    .site-label {
      position: fixed; left: 0; top: 0; pointer-events: none; text-align: center;
      background: rgba(255,248,230,0.92); border-radius: 12px; padding: 4px 10px 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); color: #3a2a14; font-size: 13px; white-space: nowrap;
    }
    .site-label b { display: block; font-size: 12px; opacity: 0.8; }
    .site-label .need { display: inline-flex; align-items: center; gap: 4px; margin: 0 4px; font-weight: 700; font-size: 15px; }
    .site-label .need.ok { color: #2e8b3a; }
    .ico { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .ico.wood { background: #7a4a24; border-radius: 7px / 4px; }
    .ico.stone { background: #a9acb1; }
    #toast {
      position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(0.7);
      color: #fff; font-size: 26px; font-weight: 800; text-shadow: 0 3px 6px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap;
    }
    #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .pill.hide { display: none; }
    .ico.plank { background: #e0b878; height: 8px; border-radius: 2px; box-shadow: 0 5px 0 #c99c5a; margin-bottom: 5px; }
    .ico.block { background: #cfd2d6; border: 2px solid #9a9ea4; box-sizing: border-box; border-radius: 2px; }
    .ico.coin { background: radial-gradient(circle at 35% 35%, #fff2a8, #f2b705 60%, #b78400); border-radius: 50%; }
    #coins {
      position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(56px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 6px;
    }
    #coins.hide { display: none; }
    .site-label .small { font-size: 11px; opacity: 0.75; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .float-text {
      position: fixed; transform: translate(-50%, -50%); pointer-events: none; color: #fff; font-weight: 800; font-size: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 4px; animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -50px; } }
    #version {
      position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(6px + env(safe-area-inset-bottom));
      color: rgba(255,255,255,0.7); font-size: 11px; pointer-events: none;
    }
    /* M5: buttons and panels */
    .ui { pointer-events: auto; }
    .btn { cursor: pointer; }
    .btn:active { transform: scale(0.94); }
    .shop-tag { background: #2e8b3a; color: #fff; font-size: 12px; padding: 2px 7px; border-radius: 9px; }
    .panel {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: flex-start; justify-content: center;
      padding: calc(110px + env(safe-area-inset-top)) 16px 16px; box-sizing: border-box; z-index: 10; touch-action: manipulation;
    }
    .panel.on { display: flex; }
    .panel .box {
      background: #fff8e6; border-radius: 18px; width: 100%; max-width: 380px; max-height: 80vh; overflow-y: auto;
      padding: 12px 14px 14px; box-sizing: border-box; color: #3a2a14; box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .panel .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 20px; }
    .panel .head b { flex: 1; }
    .panel .head .pill { box-shadow: none; background: #f0e2c0; font-size: 16px; padding: 4px 10px; }
    .panel button {
      font: inherit; font-weight: 800; font-size: 15px; border: 0; border-radius: 12px; padding: 9px 12px; min-height: 42px;
      background: #2e8b3a; color: #fff; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer;
    }
    .panel button:disabled { background: #bdb3a0; }
    .panel button.close { background: #d9442b; padding: 6px 12px; }
    .panel button[data-drop] { background: #c0702b; }
    .panel .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #ead9b4; }
    .panel .big { font-size: 26px; width: 34px; text-align: center; display: flex; justify-content: center; }
    .panel .big .ico { width: 22px; height: 22px; }
    .panel .what { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .panel .what small { font-size: 13px; opacity: 0.75; }
    .pips { display: flex; gap: 3px; margin-top: 4px; }
    .pips i { width: 14px; height: 6px; border-radius: 3px; background: #e0d0ac; }
    .pips i.on { background: #2e8b3a; }
    .panel .empty, .panel .note { margin: 8px 0 0; font-size: 13px; opacity: 0.7; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="stick"><div id="knob"></div></div>
  <div id="hint">Drag anywhere to walk</div>
  <div id="hud">
    <div class="pill" data-type="wood"><span class="ico wood"></span><span>0</span></div>
    <div class="pill" data-type="stone"><span class="ico stone"></span><span>0</span></div>
    <div class="pill hide" data-type="plank"><span class="ico plank"></span><span>0</span></div>
    <div class="pill hide" data-type="block"><span class="ico block"></span><span>0</span></div>
    <div class="pill ui btn" id="bagBtn">🎒 <span id="load">0/10</span></div>
  </div>
  <div id="coins" class="pill hide ui btn"><span class="ico coin"></span><span id="coinCount">0</span><span class="shop-tag">Shop</span></div>
  <div id="full">Back is full!</div>
  <div id="labels"></div>
  <div id="toast"></div>
  <div id="version"></div>
  <div id="shop" class="panel ui"><div class="box">
    <div class="head"><b>Upgrades</b><span class="pill have"></span><button class="close">✕</button></div>
    <div class="list"></div>
  </div></div>
  <div id="bag" class="panel ui"><div class="box">
    <div class="head"><b>Backpack</b><span class="pill have"></span><button class="close">✕</button></div>
    <div class="list"></div>
    <p class="note">Dropped pieces are gone for good.</p>
  </div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
